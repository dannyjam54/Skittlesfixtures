```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Me Dos - Skittles Fixtures</title>

<style>
:root{
    --green:#1ca34a;
    --blue:#1d62d6;
    --dark:#0b1118;
    --light:#f5f7fa;
    --grey:#666;
    --gold:#d8a400;
    --red:#d63031;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f5;
}

header{
    background:linear-gradient(135deg,#05070b,#141b24);
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:2rem;
    margin-bottom:5px;
}

header p{
    color:#4cd137;
    font-weight:bold;
    letter-spacing:2px;
}

nav{
    display:flex;
    gap:10px;
    padding:15px;
    background:white;
    position:sticky;
    top:0;
    z-index:10;
}

nav button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    background:#ddd;
}

nav button.active{
    background:var(--green);
    color:white;
}

.container{
    padding:15px;
    max-width:900px;
    margin:auto;
}

.search{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-bottom:15px;
}

.next{
    background:#e9f9ee;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid #cce9d4;
}

.card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.home{
    border-left:6px solid var(--green);
}

.away{
    border-left:6px solid var(--blue);
}

.badge{
    padding:8px 12px;
    border-radius:10px;
    color:white;
    font-size:.8rem;
    font-weight:bold;
}

.home .badge{
    background:var(--green);
}

.away .badge{
    background:var(--blue);
}

.opp{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:4px;
}

.venue{
    color:#555;
    font-size:.9rem;
}

.result{
    margin-top:6px;

}

.win{
    color:green;
}

.draw{
    color:#c98a00;
}

.lose{
    color:red;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;

    max-width:400px;
}

.modal-content h3{
    margin-bottom:10px;
}

.currentResult{
    margin-bottom:15px;

    width:100%;

.winBtn{

</head>

<body>

<header>
<h1>🎳 La Me Dos</h1>
<p>SKITTLES FIXTURES 2026/27</p>
</header>

<nav>
<button class="active" onclick="showPage('fixtures',this)">Fixtures</button>
<button onclick="showPage('archive',this)">Archive</button>
<button onclick="showPage('points',this)">Points</button>
</nav>

<div class="container">

<div id="fixturesPage">
<input type="text" class="search" placeholder="Search opponent or venue..." onkeyup="searchFixtures(this.value)">
<div id="nextFixture" class="next"></div>
<div id="fixtureList"></div>
</div>

<div id="archivePage" class="hidden">
<div id="archiveList"></div>
</div>

<div id="pointsPage" class="hidden">
<div class="pointsBox">
<h2>League Summary</h2>
<div class="stat">Played: <span id="played">0</span></div>
<div class="stat">Won: <span id="won">0</span></div>
<div class="stat">Drawn: <span id="drawn">0</span></div>
<div class="stat">Lost: <span id="lost">0</span></div>
<div class="stat"><strong>Points: <span id="points">0</span></strong></div>
</div>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">

<h3 id="modalTitle"></h3>
<div class="currentResult" id="currentResult">Current Result: None</div>

<button class="winBtn" onclick="setResult('Win')">
WIN (3 points)
</button>

<button class="drawBtn" onclick="setResult('Draw')">
DRAW (1 point)
</button>

<button class="loseBtn" onclick="setResult('Lose')">
LOSE (0 points)
</button>

<button class="clearBtn" onclick="clearResult()">
CLEAR RESULT
</button>

<button class="closeBtn" onclick="closeModal()">
CLOSE
</button>

</div>
</div>

<script>

const fixtures = [
["2026-09-09","Home","Black Horse","Roaring Twenties"],
["2026-09-17","Away","Almondsbury Social","Ibstock"],
["2026-09-23","Away","The Swan","Ship A Hoys"],
["2026-10-08","Away","Thornbury Rugby Club","Newtonians"],
["2026-10-21","Home","Black Horse","Puglers"],
["2026-11-04","Home","Black Horse","Alley Cat Strays"],
["2026-11-12","Away","Almondsbury Social","Hasslers"],
["2026-11-18","Home","Black Horse","In Laws"],
["2026-11-23","Away","Black Horse","Avons"],
["2026-12-02","Home","Black Horse","Generators"],
["2026-12-07","Away","White Hart Olveston","White Hart A"],
["2026-12-16","Home","Black Horse","X86ers"],
["2027-01-07","Away","The Wheatsheaf","Thursday Thirsties"],
["2027-01-13","Away","The Wheatsheaf","Roaring Twenties"],
["2027-01-20","Home","Black Horse","Ibstock"],
["2027-01-27","Home","Black Horse","Ship A Hoys"],
["2027-02-10","Home","Black Horse","Newtonians"],
["2027-02-19","Away","Black Horse","Puglers"],
["2027-02-24","Home","Black Horse","Obs on Tour"],
["2027-03-01","Away","Thornbury Rugby Club","Alley Cat Strays"],
["2027-03-10","Home","Black Horse","Hasslers"],
["2027-03-16","Away","The Wheatsheaf","In Laws"],
["2027-03-24","Home","Black Horse","Avons"],
["2027-04-02","Away","Almondsbury Social","Generators"],
["2027-04-07","Home","Black Horse","White Hart A"],
["2027-04-14","Away","The Rising Sun","X86ers"],
["2027-04-21","Home","Black Horse","Thursday Thirsties"]
];

let selectedIndex = null;
let results = JSON.parse(localStorage.getItem("results") || "{}");

function formatDate(dateString){

    const date = new Date(dateString);

    const days = [
        "Sunday","Monday","Tuesday","Wednesday",
        "Thursday","Friday","Saturday"
    ];

    return `${days[date.getDay()]} ${String(date.getDate()).padStart(2,"0")}/${String(date.getMonth()+1).padStart(2,"0")}/${date.getFullYear()}`;
}

function renderFixtures(){

    const today = new Date();
    let upcoming = null;

    const fixtureList = document.getElementById("fixtureList");
    const archiveList = document.getElementById("archiveList");

    fixtureList.innerHTML = "";
    archiveList.innerHTML = "";

    fixtures.forEach((f,index)=>{

        const date = new Date(f[0]);

        if(!upcoming && date >= today){
            upcoming = f;
        }

        const result = results[index] || "";

        const card = document.createElement("div");

        card.className = "card " + (f[1] === "Home" ? "home" : "away");

        card.innerHTML = `
        <div>
            <div class="opp">${f[3]}</div>
            <div class="venue">${formatDate(f[0])} • ${f[2]} • ${f[1]}</div>
            <div class="result ${result.toLowerCase()}">${result}</div>
        </div>
        <div class="badge">${f[1]}</div>
        `;

        card.onclick = ()=>{
            selectedIndex = index;
            document.getElementById("modalTitle").innerText = f[3];
            document.getElementById("currentResult").innerText =
                "Current Result: " + (results[index] || "None");
            document.getElementById("modal").style.display = "flex";
        };

        if(date < today){
            archiveList.appendChild(card);
        }else{
            fixtureList.appendChild(card);
        }

    });

    if(upcoming){
        document.getElementById("nextFixture").innerHTML =
        `<strong>Next Fixture</strong><br>
        ${formatDate(upcoming[0])}<br>
        vs ${upcoming[3]}`;
    }

    if(archiveList.innerHTML === ""){
        archiveList.innerHTML = '<div class="empty">No archived fixtures yet.</div>';
    }

    updatePoints();
}

function setResult(result){

    results[selectedIndex] = result;

    localStorage.setItem(
        "results",
        JSON.stringify(results)
    );

    closeModal();
    renderFixtures();
}

function clearResult(){

    if(selectedIndex === null) return;

    if(!confirm("Clear result for this fixture?")) return;

    results[selectedIndex] = "";

    localStorage.setItem(
        "results",
        JSON.stringify(results)
    );

    closeModal();
    renderFixtures();
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function updatePoints(){

    let won = 0;
    let drawn = 0;
    let lost = 0;

    Object.values(results).forEach(r=>{

        if(!r) return;

        if(r === "Win") won++;
        if(r === "Draw") drawn++;
        if(r === "Lose") lost++;

    });

    const played = won + drawn + lost;
    const points = (won * 3) + drawn;

    document.getElementById("played").innerText = played;
    document.getElementById("won").innerText = won;
    document.getElementById("drawn").innerText = drawn;
    document.getElementById("lost").innerText = lost;
    document.getElementById("points").innerText = points;
}

function searchFixtures(text){

    text = text.toLowerCase();

    document.querySelectorAll("#fixtureList .card")
    .forEach(card=>{

        card.style.display =
        card.innerText.toLowerCase().includes(text)
        ? "flex"
        : "none";

    });
}

function showPage(page,btn){

    document.querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("fixturesPage").classList.add("hidden");
    document.getElementById("archivePage").classList.add("hidden");
    document.getElementById("pointsPage").classList.add("hidden");

    document.getElementById(page + "Page")
    .classList.remove("hidden");
}

renderFixtures();

</script>

</body>
</html>
